name: Publier une version

# Pousser une étiquette « v1.2.3 » crée automatiquement une Release avec le zip prêt à installer.
on:
  push:
    tags: ['v*', '[0-9]*']      # « v2.1.0 » ou « 2.1.0 », avec ou sans suffixe (-beta.1)
  workflow_dispatch:             # relance manuelle pour une étiquette existante (Actions > Publier une version > Run workflow)
    inputs:
      tag:
        description: 'Étiquette existante dont il faut (re)construire le zip (ex. v2.1.0-beta.3)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Vérifier la syntaxe PHP
        run: find . -name '*.php' -not -path './includes/plugin-update-checker/*' -print0 | xargs -0 -n1 php -l | grep -v '^No syntax errors' || true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Embarquer les bibliothèques JavaScript (aucun CDN dans le zip)
        run: bash tools/fetch-libs.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, mbstring
          tools: composer:v2
      - name: Embarquer mPDF (PDF direct, aucune installation à faire)
        run: |
          composer install --no-dev --prefer-dist --no-interaction --working-dir=modules/book
          # Allègement : on ne garde que les polices DejaVu (utilisées par le livre) et on retire tests et documentation.
          find modules/book/vendor/mpdf/mpdf/ttfonts -type f ! -name 'DejaVu*' -delete
          find modules/book/vendor \( -iname tests -o -iname test -o -iname docs -o -iname examples -o -name .github \) -type d -prune -exec rm -rf {} +
          rm -f modules/book/composer.lock
          php tools/check-mpdf.php
          du -sh modules/book/vendor
      - name: Construire le zip (dossier tng-suite/)
        run: |
          mkdir -p /tmp/build/tng-suite
          rsync -a --exclude='.git' --exclude='.github' --exclude='.gitignore' --exclude='.gitattributes' --exclude='README.md' ./ /tmp/build/tng-suite/
          (cd /tmp/build && zip -qr "$GITHUB_WORKSPACE/tng-suite.zip" tng-suite)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: tng-suite.zip
          generate_release_notes: true
